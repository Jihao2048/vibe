<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>颜色选择器</title>
    <link href="design.css" rel="stylesheet">
    <script src="dat.js"></script>
</head>
<body>
    <div class="card">
        <h1>颜色选择器</h1>
        <div class="color-preview" id="colorDisplay"></div>
        <input type="color" id="colorPicker" value="#4285F4">
        <div class="input-group">
            <label for="hexInput">十六进制颜色码</label>
            <input type="text" id="hexInput" class="text-input" placeholder="例如: 4285F4">
        </div>
        <div class="input-group">
            <label>RGB 值</label>
            <div class="rgb-inputs">
                <input type="number" id="redInput" min="0" max="255" class="rgb-input" placeholder="R">
                <input type="number" id="greenInput" min="0" max="255" class="rgb-input" placeholder="G">
                <input type="number" id="blueInput" min="0" max="255" class="rgb-input" placeholder="B">
            </div>
        </div>
        <div class="preset-colors">
            <h3>预设颜色</h3>
            <div class="preset-grid" id="presetColors"></div>
        </div>
    </div>
    
    <script>
        const colorPicker = document.getElementById('colorPicker');
        const hexInput = document.getElementById('hexInput');
        const redInput = document.getElementById('redInput');
        const greenInput = document.getElementById('greenInput');
        const blueInput = document.getElementById('blueInput');
        const colorDisplay = document.getElementById('colorDisplay');
        const presetColors = document.getElementById('presetColors');

        // 初始化颜色显示
        function updateColorDisplay(color) {
            colorDisplay.style.backgroundColor = color;
        }

        // 初始化预设颜色
        function initPresetColors() {
            // 按颜色分类
            const colorGroups = {
                '绿色': DefaultColors.filter(color => color.name.includes('绿')|| color.name === '马尔斯'),
                '蓝色': DefaultColors.filter(color => color.name.includes('蓝')),
                '红色': DefaultColors.filter(color => color.name.includes('红') || color.name.includes('粉') || color.name === '淡玫瑰'),
            };

            // 为每个颜色分类创建区域
            for (const [groupName, colors] of Object.entries(colorGroups)) {
                if (colors.length === 0) continue;
                
                const groupContainer = document.createElement('div');
                groupContainer.className = 'color-group';
                groupContainer.style.marginBottom = '25px'; // 增加组间距
                
                const groupTitle = document.createElement('h4');
                groupTitle.textContent = groupName;
                groupContainer.appendChild(groupTitle);
                
                const groupGrid = document.createElement('div');
                groupGrid.className = 'preset-grid';
                
                colors.forEach(color => {
                    const colorWrapper = document.createElement('div');
                    colorWrapper.className = 'color-item';
                    
                    const colorElement = document.createElement('div');
                    colorElement.className = 'preset-color';
                    colorElement.style.backgroundColor = `#${color.hex}`;
                    
                    const colorLabel = document.createElement('span');
                    colorLabel.className = 'color-label';
                    colorLabel.textContent = color.name;
                    
                    colorWrapper.appendChild(colorElement);
                    colorWrapper.appendChild(colorLabel);
                    colorWrapper.addEventListener('click', () => {
                        colorPicker.value = `#${color.hex}`;
                        colorPicker.dispatchEvent(new Event('input'));
                    });
                    
                    groupGrid.appendChild(colorWrapper);
                });
                
                groupContainer.appendChild(groupGrid);
                presetColors.appendChild(groupContainer);
            }
        }

        // 颜色选择器改变时更新输入框和显示区域
        colorPicker.addEventListener('input', function () {
            const selectedColor = this.value;
            hexInput.value = selectedColor.slice(1).toUpperCase();

            const r = parseInt(selectedColor.slice(1, 3), 16);
            const g = parseInt(selectedColor.slice(3, 5), 16);
            const b = parseInt(selectedColor.slice(5, 7), 16);

            redInput.value = r;
            greenInput.value = g;
            blueInput.value = b;

            updateColorDisplay(selectedColor);
        });

        // 十六进制输入框改变时更新颜色选择器和显示区域
        hexInput.addEventListener('input', function () {
            const inputHex = this.value.trim().toUpperCase();
            if (/^([A-F0-9]{3}|[A-F0-9]{6})$/.test(inputHex)) {
                const fullHex = inputHex.length === 3 
                    ? inputHex.split('').map(c => c + c).join('')
                    : inputHex;
                const hex = `#${fullHex}`;
                colorPicker.value = hex;
                const r = parseInt(fullHex.slice(0, 2), 16);
                const g = parseInt(fullHex.slice(2, 4), 16);
                const b = parseInt(fullHex.slice(4, 6), 16);
                redInput.value = r;
                greenInput.value = g;
                blueInput.value = b;
                updateColorDisplay(hex);
            }
        });

        // RGB 输入框改变时更新颜色选择器和显示区域
        function updateFromRGB() {
            const r = Math.min(255, Math.max(0, parseInt(redInput.value) || 0));
            const g = Math.min(255, Math.max(0, parseInt(greenInput.value) || 0));
            const b = Math.min(255, Math.max(0, parseInt(blueInput.value) || 0));

            redInput.value = r;
            greenInput.value = g;
            blueInput.value = b;

            const hex = `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`.toUpperCase();
            colorPicker.value = hex;
            hexInput.value = hex.slice(1);
            updateColorDisplay(hex);
        }

        redInput.addEventListener('input', updateFromRGB);
        greenInput.addEventListener('input', updateFromRGB);
        blueInput.addEventListener('input', updateFromRGB);

        // 初始化显示
        colorPicker.dispatchEvent(new Event('input'));
        initPresetColors();
    </script>
</body>
</html>

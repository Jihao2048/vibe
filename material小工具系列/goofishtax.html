<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>闲鱼税计算器</title>
    <link href="design.css" rel="stylesheet">
</head>
<body>
    <div class="card">
        <h1>闲鱼税计算器</h1>
        
        <div class="input-group">
            <label for="price">商品价格（含运费）</label>
            <input type="number" id="price" placeholder="输入金额（元）" class="input-field">
        </div>
        <button onclick="calculateTax()" class="btn">计算税费</button>
        <div id="error"></div>
        
        <div class="result" id="result" style="display: none;">
            <div class="result-item">
                <span class="result-label">商品原价</span>
                <span class="result-value" id="original-price">0.00 元</span>
            </div>
            <div class="result-item">
                <span class="result-label">闲鱼税费 (0.6%)</span>
                <span class="result-value" id="tax">0.00 元</span>
            </div>
            <div class="result-item">
                <span class="result-label">实际到手</span>
                <span class="result-value" id="actual-amount">0.00 元</span>
            </div>
            <div class="result-item">
                <span class="result-label">推荐定价</span>
                <span class="result-value highlight" id="suggested-price">0.00 元</span>
            </div>
        </div>
        
        <div class="note">
            <p><strong>闲鱼收费规则：</strong>按单笔订单成交金额（含运费）的0.6%向卖方收取服务费，上不封顶。</p>
            <p><strong>推荐定价说明：</strong>推荐定价=原价/(1-0.6%)，可确保扣除手续费后实际到手金额等于原价。</p>
        </div>
    </div>

    <script>
        function calculateTax() {
            const priceInput = document.getElementById('price');
            const errorElement = document.getElementById('error');
            const resultElement = document.getElementById('result');
            
            // 获取输入价格
            const price = parseFloat(priceInput.value);
            
            // 验证输入
            if (isNaN(price) || price <= 0) {
                errorElement.textContent = '请输入有效的金额';
                resultElement.style.display = 'none';
                return;
            }
            
            errorElement.textContent = '';
            
            // 计算税费（0.6%，上不封顶）
            let tax = price * 0.006;
            tax = Math.round(tax * 100) / 100;
            
            // 计算实际到手金额
            const actualAmount = price - tax;
            
            // 计算推荐定价（确保扣除手续费后等于原价）
            let suggestedPrice = price / (1 - 0.006);
            suggestedPrice = Math.round(suggestedPrice * 100) / 100;
            
            // 显示结果
            document.getElementById('original-price').textContent = price.toFixed(2) + ' 元';
            document.getElementById('tax').textContent = tax.toFixed(2) + ' 元';
            document.getElementById('actual-amount').textContent = actualAmount.toFixed(2) + ' 元';
            document.getElementById('suggested-price').textContent = suggestedPrice.toFixed(2) + ' 元';
            
            resultElement.style.display = 'block';
        }
        
        // 添加回车键支持
        document.getElementById('price').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateTax();
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Code 作品展览</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-particles" id="particles"></div>

    <nav class="navbar">
        <div class="navbar-inner">
            <div class="logo"><img src="favicon.svg" alt="Vibe Code" class="logo-icon"> Vibe Code</div>
            <ul class="nav-links">
                <li><a href="#gallery">作品展览</a></li>
                <li><a href="#about">关于展览</a></li>
            </ul>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-badge">🎨 2026 年度展览</div>
        <h1>Vibe Code<br>创意作品展</h1>
        <p>每一行代码，都是一种表达。</p>
        <div class="hero-cta">
            <a href="#gallery" class="btn btn-primary">探索作品</a>
            <a href="#about" class="btn btn-outline">了解更多</a>
            <a href="https://www.ias1054.cn" class="btn btn-outline" target="_blank" rel="noopener noreferrer">返回主站</a>
        </div>
    </section>

    <section class="section" id="gallery">
        <div class="section-header reveal">
            <div class="section-label">Gallery</div>
            <h2 class="section-title">精选作品</h2>
            <p class="section-desc">探索我用心打造的精彩作品，感受代码与艺术的交汇。</p>
        </div>

        <div class="gallery" id="galleryGrid"></div>
    </section>

    <section class="section" id="about">
        <div class="section-header reveal">
            <div class="section-label">About</div>
            <h2 class="section-title">关于展览</h2>
            <p class="section-desc">Vibe Code 是我的个人作品展览，记录我的代码与创意之旅。</p>
            <a href="https://www.ias1054.cn" class="btn btn-primary" target="_blank" rel="noopener noreferrer">返回主站看其他内容 →</a>
        </div>
    </section>

    <footer class="footer">
        <p>Made with <span class="heart">❤</span> by Me · 2026</p>
    </footer>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modalClose">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
